name: Build Desktop Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的版本 Tag；留空则使用 GitHub 页面当前选择的 ref'
        required: false
        type: string
        default: ''
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            ui/package-lock.json

      - name: Install Web UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build Web UI
        working-directory: ui
        run: npm run build

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Ensure Electron runtime
        working-directory: desktop
        env:
          ELECTRON_INSTALL_ATTEMPTS: 5
        run: npm run ensure:electron

      - name: Set desktop version from Tag
        working-directory: desktop
        env:
          MOTHX_VERSION: ${{ inputs.tag || github.ref_name }}
        run: npm run version:set

      - name: Build desktop runtime
        working-directory: desktop
        run: npm run build

      - name: Build desktop package
        working-directory: desktop
        env:
          MOTHX_VERSION: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --config electron-builder.yml --${{ matrix.platform }}

      - name: Generate checksums
        shell: bash
        working-directory: desktop
        run: |
          cd release
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum MothX-* > checksums.txt
          else
            shasum -a 256 MothX-* > checksums.txt
          fi

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            desktop/release/MothX-*
            desktop/release/checksums.txt
